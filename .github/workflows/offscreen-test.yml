name: QEMU Isolated Tests

on:
  push:
    branches: [ main, master ]
  pull_request:
    branches: [ main, master ]

jobs:
  lint:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
      - name: Install shellcheck
        run: sudo apt-get update && sudo apt-get install -y shellcheck
      - name: Shellcheck scripts
        run: shellcheck -S error scripts/*.sh build.sh

  build-vm-image:
    runs-on: ubuntu-26.04
    outputs:
      image-path: ${{ steps.build.outputs.image-path }}
      kernel-path: ${{ steps.build.outputs.kernel-path }}
      initrd-path: ${{ steps.build.outputs.initrd-path }}
    steps:
      - uses: actions/checkout@v4
      - name: Install build dependencies
        run: sudo apt-get update && sudo apt-get install -y qemu-utils debootstrap parted
      - name: Build VM image
        id: build
        run: |
          sudo ./scripts/build-vm-image.sh
          echo "image-path=$(pwd)/lowgui-test.img" >> $GITHUB_OUTPUT
          echo "kernel-path=$(pwd)/vmlinuz" >> $GITHUB_OUTPUT
          echo "initrd-path=$(pwd)/initrd.img" >> $GITHUB_OUTPUT
      - name: Cache VM image
        uses: actions/cache@v4
        with:
          path: |
            lowgui-test.img
            vmlinuz
            initrd.img
            vm-key
          key: vm-image-${{ hashFiles('scripts/build-vm-image.sh', 'scripts/provision-chroot.sh', 'scripts/run-tests-in-vm.sh') }}

  xvfb-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: Build
        run: ./build.sh -t plan+v4d+lowgui -j$(nproc)
      - name: Run offscreen tests
        run: timeout 300s xvfb-run -a ./opencv/build/bin/opencv_test_lowgui_offscreen --gtest_output=xml:offscreen-results.xml
        env:
          LIBGL_ALWAYS_SOFTWARE: 1
          GALLIUM_DRIVER: swrast
          EGL_PLATFORM: surfaceless
      - name: Run main tests under Xvfb
        run: timeout 300s xvfb-run -a ./opencv/build/bin/opencv_test_lowgui --gtest_output=xml:main-results.xml
      - name: Upload offscreen results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: offscreen-test-results
          path: |
            offscreen-results.xml
            main-results.xml

  asan-tests:
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Install dependencies
        run: sudo apt-get update && sudo apt-get install -y xvfb libgl1-mesa-dri mesa-utils
      - name: Build with AddressSanitizer
        run: ./build.sh -t plan+v4d+lowgui -b asan -j$(nproc)
      - name: Run offscreen tests under ASan
        run: |
          timeout 600s xvfb-run -a ./opencv/build/bin/opencv_test_lowgui_offscreen \
            --gtest_output=xml:asan-offscreen-results.xml
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      - name: Run main tests under ASan
        run: |
          timeout 600s xvfb-run -a ./opencv/build/bin/opencv_test_lowgui \
            --gtest_output=xml:asan-main-results.xml
        env:
          ASAN_OPTIONS: detect_leaks=0:abort_on_error=1
      - name: Upload ASan results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: asan-test-results
          path: |
            asan-offscreen-results.xml
            asan-main-results.xml

  qemu-tests:
    needs: build-vm-image
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive
      - name: Restore cached VM image
        uses: actions/cache@v4
        with:
          path: |
            lowgui-test.img
            vmlinuz
            initrd.img
            vm-key
          key: vm-image-${{ hashFiles('scripts/build-vm-image.sh', 'scripts/provision-chroot.sh', 'scripts/run-tests-in-vm.sh') }}
      - name: Run tests in QEMU
        run: |
          ./scripts/vm-boot-and-test.sh \
            --image lowgui-test.img \
            --kernel vmlinuz \
            --initrd initrd.img \
            --repo-path ${{ github.workspace }}/.. \
            --ssh-key vm-key \
            --out-dir ${{ runner.temp }}/qemu-out
      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: qemu-test-results
          path: ${{ runner.temp }}/qemu-out/**
